name: Deploy atômico para Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Validar secrets de SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          test -n "$SSH_HOST" || (echo "Secret ausente: SSH_HOST" && exit 1)
          test -n "$SSH_USERNAME" || (echo "Secret ausente: SSH_USERNAME" && exit 1)
          test -n "$SSH_PASSWORD" || (echo "Secret ausente: SSH_PASSWORD" && exit 1)
          test -n "$SSH_TARGET_DIR" || (echo "Secret ausente: SSH_TARGET_DIR" && exit 1)

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validar e compilar frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run check

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, fileinfo, gd, json, mbstring, simplexml, xml, xmlreader, xmlwriter, zip
          coverage: none

      - name: Instalar dependências
        run: composer install --no-dev --optimize-autoloader

      - name: Auditar dependências
        run: |
          composer validate --strict
          composer audit --locked

      - name: Executar testes de segurança
        run: |
          php tests/upload_security_test.php
          php tests/asaas_webhook_security_test.php
          php tests/asaas_identity_safety_test.php
          php tests/asaas_customer_identity_behavior_test.php
          php tests/admin_settle_payment_security_test.php
          php tests/oficina_modular_validity_date_test.php
          php tests/oficina_modular_authorization_test.php
          php tests/payment_lifecycle_behavior_test.php
          php tests/authentication_security_test.php
          php tests/guardian_account_identity_test.php
          php tests/family_student_selection_test.php
          php tests/login_session_security_test.php
          php tests/xss_security_test.php
          php tests/monthly_workshop_security_test.php
          php tests/monthly_legacy_charge_audit_test.php
          php tests/deploy_release_security_test.php
          php tests/admin_dashboard_contract_test.php
          php tests/admin_dashboard_data_loader_test.php
          php tests/admin_dashboard_view_rbac_test.php
          php tests/vite_assets_test.php
          php tests/vite_assets_flattened_release_test.php
          php tests/exclusion_log_storage_test.php

      - name: Montar release imutável
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp -a public/. deploy/
          cp -a src deploy/
          cp -a vendor deploy/
          cp ops/hostinger-root.htaccess deploy/.release-root.htaccess

          printf '{"release":"%s","commit":"%s","run_id":"%s","built_at":"%s"}\n' \
            "$RELEASE_ID" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" \
            > deploy/release-manifest.json

          if [ -e deploy/.env ] || [ -e deploy/.env.example ] || [ -e deploy/storage ]; then
            echo "ERRO: release contém segredo ou estado persistente."
            exit 1
          fi

          mapfile -t BLOCKED_ARTIFACTS < <(
            find deploy -type f \( \
              -name '*.bak' -o -name '*.bak.*' -o \
              -name '*.bkp' -o -name '*.bkp.*' -o \
              -name '*.old' -o -name '*.old.*' -o \
              -name '*.orig' -o -name '*.orig.*' -o \
              -name '*.save' -o -name '*.save.*' -o \
              -name '*.swp' -o -name '*.swp.*' -o \
              -name '*.sql' -o -name '*.sql.*' -o \
              -name '*.zip' -o -name '*.zip.*' -o \
              -name '*.tar' -o -name '*.tar.*' -o \
              -name '*.gz' -o -name '*.gz.*' -o \
              -name '*.7z' -o -name '*.7z.*' \
            \) -print
          )
          if [ "${#BLOCKED_ARTIFACTS[@]}" -gt 0 ]; then
            echo "ERRO: artefatos proibidos no pacote de deploy:"
            printf '%s\n' "${BLOCKED_ARTIFACTS[@]}"
            exit 1
          fi

          while IFS= read -r -d '' php_file; do
            php -l "$php_file"
          done < <(find deploy -type f -name '*.php' -print0)

          test -f deploy/assets/admin-dist/manifest.json
          ADMIN_JS="$(jq -r '."frontend/admin/main.ts".file // empty' deploy/assets/admin-dist/manifest.json)"
          ADMIN_CSS="$(jq -r '."frontend/admin/main.ts".css[0] // empty' deploy/assets/admin-dist/manifest.json)"
          test -n "$ADMIN_JS"
          test -n "$ADMIN_CSS"
          test -s "deploy/assets/admin-dist/$ADMIN_JS"
          test -s "deploy/assets/admin-dist/$ADMIN_CSS"
          php -r 'require "deploy/vendor/autoload.php"; $a=\App\ViteAssets::adminDashboard(); if (empty($a["script"]) || empty($a["styles"])) { exit(1); }'

      - name: Diagnóstico SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

          sshpass -p "$SSH_PASSWORD" ssh \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            "$SSH_USERNAME@$SSH_HOST" \
            "test -d \"$SSH_TARGET_DIR\" && test -w \"$SSH_TARGET_DIR\""

      - name: Preparar diretório remoto da release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            TARGET="${{ secrets.SSH_TARGET_DIR }}"
            TARGET="${TARGET%/}"
            RELEASE_ID="${{ env.RELEASE_ID }}"

            if [ -z "$TARGET" ] || [ "$TARGET" = "/" ]; then
              echo "SSH_TARGET_DIR inseguro."
              exit 1
            fi
            if ! printf '%s' "$RELEASE_ID" | grep -Eq '^[0-9a-f]+-[0-9]+-[0-9]+$'; then
              echo "RELEASE_ID inválido."
              exit 1
            fi

            RELEASES="$TARGET/.releases"
            RELEASE="$RELEASES/$RELEASE_ID"
            PARENT="$(dirname "$TARGET")"
            test -d "$TARGET"
            test -w "$TARGET"
            test -f "$PARENT/.env" || {
              echo "ERRO: .env persistente não encontrado fora do document root."
              exit 1
            }

            mkdir -p "$RELEASES"
            test ! -e "$RELEASE" || {
              echo "ERRO: release imutável já existe: $RELEASE_ID"
              exit 1
            }
            mkdir "$RELEASE"

            PROBE_FILE="$RELEASES/.symlink-probe-target-${{ github.run_id }}-${{ github.run_attempt }}"
            PROBE_LINK="$RELEASES/.symlink-probe-link-${{ github.run_id }}-${{ github.run_attempt }}"
            rm -f "$PROBE_LINK" "$PROBE_FILE"
            printf 'ok' > "$PROBE_FILE"
            ln -s "$(basename "$PROBE_FILE")" "$PROBE_LINK"
            test "$(cat "$PROBE_LINK")" = "ok"
            rm -f "$PROBE_LINK" "$PROBE_FILE"

      - name: Enviar release para staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy"
          target: "${{ secrets.SSH_TARGET_DIR }}/.releases/${{ env.RELEASE_ID }}"
          strip_components: 1

      - name: Validar e ativar release atomicamente
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            TARGET="${{ secrets.SSH_TARGET_DIR }}"
            TARGET="${TARGET%/}"
            RELEASE_ID="${{ env.RELEASE_ID }}"
            RELEASES="$TARGET/.releases"
            RELEASE="$RELEASES/$RELEASE_ID"
            CURRENT="$RELEASES/current"
            PARENT="$(dirname "$TARGET")"

            test -f "$RELEASE/release-manifest.json"
            grep -Fq "\"release\":\"$RELEASE_ID\"" "$RELEASE/release-manifest.json"
            test -f "$RELEASE/.htaccess"
            test -f "$RELEASE/.release-root.htaccess"
            test -f "$RELEASE/admin/dashboard.php"
            test -f "$RELEASE/vendor/autoload.php"
            test -f "$RELEASE/assets/admin-dist/manifest.json"
            test ! -e "$RELEASE/storage"
            test ! -e "$RELEASE/.env"

            ADMIN_JS="$(php -r '$m=json_decode(file_get_contents($argv[1]),true); echo $m["frontend/admin/main.ts"]["file"] ?? "";' "$RELEASE/assets/admin-dist/manifest.json")"
            ADMIN_CSS="$(php -r '$m=json_decode(file_get_contents($argv[1]),true); echo $m["frontend/admin/main.ts"]["css"][0] ?? "";' "$RELEASE/assets/admin-dist/manifest.json")"
            test -n "$ADMIN_JS"
            test -n "$ADMIN_CSS"
            test -s "$RELEASE/assets/admin-dist/$ADMIN_JS"
            test -s "$RELEASE/assets/admin-dist/$ADMIN_CSS"

            mkdir -p "$TARGET/storage"
            ln -s "../../storage" "$RELEASE/storage"
            ln -s "../../../.env" "$RELEASE/.env"
            test -d "$RELEASE/storage"
            test -f "$RELEASE/.env"

            php -l "$RELEASE/health.php"
            php -l "$RELEASE/src/Bootstrap.php"
            php -l "$RELEASE/admin/dashboard.php"
            php -l "$RELEASE/api/login.php"
            HEALTH_OUTPUT="$(php "$RELEASE/health.php")"
            echo "$HEALTH_OUTPUT"
            echo "$HEALTH_OUTPUT" | grep -Fq "\"release\":\"$RELEASE_ID\""

            PREVIOUS=""
            if [ -L "$CURRENT" ]; then
              PREVIOUS="$(readlink "$CURRENT")"
              test -d "$RELEASES/$PREVIOUS"
            elif [ -e "$CURRENT" ]; then
              echo "ERRO: .releases/current existe, mas não é symlink."
              exit 1
            fi

            printf '%s\n' "$PREVIOUS" > "$RELEASE/.previous-release"
            if [ -f "$TARGET/.htaccess" ]; then
              cp "$TARGET/.htaccess" "$RELEASE/.previous-root-htaccess"
            else
              touch "$RELEASE/.previous-root-htaccess-absent"
            fi
            touch "$RELEASE/.activation-started"

            NEXT_LINK="$RELEASES/.current-next-${{ github.run_id }}"
            rm -f "$NEXT_LINK"
            ln -s "$RELEASE_ID" "$NEXT_LINK"
            mv -Tf "$NEXT_LINK" "$CURRENT"

            cp "$RELEASE/.release-root.htaccess" "$TARGET/.htaccess.next"
            mv -f "$TARGET/.htaccess.next" "$TARGET/.htaccess"
            rm -f "$RELEASE/.release-root.htaccess"
            touch "$RELEASE/.activated"

      - name: Verificar produção pela Internet
        env:
          HEALTH_URL: https://diarias.village.einsteinhub.co/health.php
        run: |
          HEALTH_OUTPUT="$(curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            "$HEALTH_URL?release=$RELEASE_ID")"
          echo "$HEALTH_OUTPUT"
          echo "$HEALTH_OUTPUT" | grep -Fq "\"release\":\"$RELEASE_ID\""

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --output /dev/null \
            https://diarias.village.einsteinhub.co/
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --output /dev/null \
            https://diarias.village.einsteinhub.co/admin/dashboard.php

          MANIFEST_URL="https://diarias.village.einsteinhub.co/assets/admin-dist/manifest.json"
          MANIFEST="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 2 --retry-all-errors \
            "$MANIFEST_URL")"
          ADMIN_JS="$(printf '%s' "$MANIFEST" | jq -r '."frontend/admin/main.ts".file // empty')"
          ADMIN_CSS="$(printf '%s' "$MANIFEST" | jq -r '."frontend/admin/main.ts".css[0] // empty')"
          test -n "$ADMIN_JS"
          test -n "$ADMIN_CSS"
          curl --fail --silent --show-error --output /dev/null \
            "https://diarias.village.einsteinhub.co/assets/admin-dist/$ADMIN_JS"
          curl --fail --silent --show-error --output /dev/null \
            "https://diarias.village.einsteinhub.co/assets/admin-dist/$ADMIN_CSS"

      - name: Reverter ativação após falha
        if: ${{ failure() }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            TARGET="${{ secrets.SSH_TARGET_DIR }}"
            TARGET="${TARGET%/}"
            RELEASE_ID="${{ env.RELEASE_ID }}"
            RELEASES="$TARGET/.releases"
            RELEASE="$RELEASES/$RELEASE_ID"
            CURRENT="$RELEASES/current"

            if [ ! -f "$RELEASE/.activation-started" ]; then
              echo "Nenhuma ativação iniciada; rollback desnecessário."
              exit 0
            fi

            PREVIOUS="$(cat "$RELEASE/.previous-release" 2>/dev/null || true)"
            if [ -n "$PREVIOUS" ]; then
              test -d "$RELEASES/$PREVIOUS"
              ROLLBACK_LINK="$RELEASES/.current-rollback-${{ github.run_id }}"
              rm -f "$ROLLBACK_LINK"
              ln -s "$PREVIOUS" "$ROLLBACK_LINK"
              mv -Tf "$ROLLBACK_LINK" "$CURRENT"
            else
              rm -f "$CURRENT"
            fi

            if [ -f "$RELEASE/.previous-root-htaccess" ]; then
              cp "$RELEASE/.previous-root-htaccess" "$TARGET/.htaccess.rollback"
              mv -f "$TARGET/.htaccess.rollback" "$TARGET/.htaccess"
            elif [ -f "$RELEASE/.previous-root-htaccess-absent" ]; then
              rm -f "$TARGET/.htaccess"
            else
              echo "ERRO: estado anterior do dispatcher não foi preservado."
              exit 1
            fi

            if [ -n "$PREVIOUS" ]; then
              echo "Rollback concluído para $PREVIOUS, incluindo o dispatcher."
            else
              echo "Primeira ativação revertida para o deploy legado."
            fi

            touch "$RELEASE/.rolled-back"

      - name: Remover backups legados do servidor e releases antigas
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            TARGET="${{ secrets.SSH_TARGET_DIR }}"
            TARGET="${TARGET%/}"
            RELEASES="$TARGET/.releases"
            CURRENT_TARGET="$(readlink "$RELEASES/current")"

            LEGACY_BACKUPS="
            $TARGET/dashboard.php.bkp
            $TARGET/index.php.bkp
            $TARGET/index.bak.php
            $TARGET/login.php.bkp
            $TARGET/primeiro-acesso.php.bkp
            $TARGET/profile.php.bkp
            $TARGET/default.php.old.php
            $TARGET/assets/style.css.bkp
            "
            for FILE in $LEGACY_BACKUPS; do
              rm -f -- "$FILE"
            done

            KEPT=0
            for DIR in $(ls -1dt "$RELEASES"/[0-9a-f]*-* 2>/dev/null || true); do
              NAME="$(basename "$DIR")"
              if [ "$NAME" = "$CURRENT_TARGET" ]; then
                KEPT=$((KEPT + 1))
                continue
              fi
              KEPT=$((KEPT + 1))
              if [ "$KEPT" -gt 5 ]; then
                rm -rf -- "$DIR"
              fi
            done

            test -L "$RELEASES/current"
            test -f "$RELEASES/current/release-manifest.json"
            echo "Release ativa: $CURRENT_TARGET"
